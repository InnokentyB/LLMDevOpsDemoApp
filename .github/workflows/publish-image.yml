name: Publish immutable demo image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Verify the packaged application starts
        run: |
          docker build -t vibehosting-smoke .
          docker run -d --name vibehosting-smoke -p 127.0.0.1:18080:8080 vibehosting-smoke
          trap 'docker rm -f vibehosting-smoke' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health
          curl --fail http://127.0.0.1:18080/assets/unbounded.ttf --output /dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/innokentyb/llmdevops-demo-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
